name: 更新資料並發布

on:
  workflow_dispatch:
  schedule:
    # GitHub cron 是 UTC。台灣時間是 UTC+8。
    # 週一到週五 15:30（收盤後）與 21:00（補抓較晚公布的法人資料）。
    - cron: "30 7 * * 1-5"
    - cron: "0 13 * * 1-5"
  push:
    branches: [main]
    paths-ignore:
      - "site/data/latest.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tw-stock-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 取出程式
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 檢查指標計算
        run: python scripts/test_indicators.py

      - name: 抓取證交所資料
        run: python scripts/fetch_data.py

      - name: 把新資料寫回主線
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json
          if git diff --staged --quiet; then
            echo "資料與倉庫裡的檔案相同，不另外 commit"
          else
            git commit -m "chore: update market data"
            git push origin HEAD:main
          fi

      - name: 打包網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
