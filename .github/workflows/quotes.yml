name: 更新盤中報價

on:
  workflow_dispatch:
  schedule:
    # 台灣時間週一到週五 09:00–13:45，每 15 分鐘。cron 為 UTC。
    - cron: "*/15 1-5 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tw-stock-pages
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 取出程式
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓盤中報價
        run: python scripts/refresh_quotes.py

      - name: 把報價寫回主線
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/catalog.json
          if git diff --staged --quiet; then
            echo "報價沒有變"
          else
            git commit -m "chore: refresh intraday quotes"
            git push origin HEAD:main
          fi

      - name: 打包網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: quotes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
